version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [chore, dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Packages that only work at matching versions move together, in their own PR.
      auth:
        patterns: ["better-auth", "@better-auth/*", "@convex-dev/better-auth"]
      tiptap:
        patterns: ["@tiptap/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js version that runs the site
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @convex-dev/better-auth 0.12 supports better-auth >=1.6.11 <1.7.0. Remove this once
      # a release supports 1.7 (its advisories need plugins this app doesn't use).
      - dependency-name: "better-auth"
        versions: [">=1.7.0"]
      # From 27.1, jsdom's dependencies (@exodus/bytes, @asamuzakjp/css-color 7) require()
      # ESM-only packages, which Vercel's runtime refuses, and every post page fails (#82).
      # Pinned at 27.0.1; retry when a release loads there.
      - dependency-name: "jsdom"
        versions: [">27.0.1"]
      - dependency-name: "@types/jsdom"
        versions: [">27.0.0"]
      # typescript-eslint (through eslint-config-next) supports TypeScript <6.1; with 7.0 the
      # linter doesn't start. Remove once a typescript-eslint release supports 7.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [chore, dependencies]
    commit-message:
      prefix: chore
      include: scope
