version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [chore, dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types must match the Node.js version that runs the site
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [chore, dependencies]
    commit-message:
      prefix: chore
      include: scope
